<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOTI GO - Administración</title>

    <link
        rel="stylesheet"
        href="../css/moti-go.css"
    >

</head>

<body>

    <main>

        <h1>MOTI GO</h1>

        <h2>Panel de administración</h2>

        <p>
            Panel administrativo de MOTI GO
        </p>

        <button id="btnCerrarSesion">
            Cerrar sesión
        </button>

    </main>


    <script type="module">

    import {
        auth
    } from "../js/firebase-config.js";


    import {
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    onAuthStateChanged(
        auth,
        (
            usuario
        ) => {

            if (!usuario) {

                console.warn(
                    "⚠️ MOTI GO: administrador no autenticado."
                );

                window.location.href =
                    "../index.html";

                return;

            }


            console.log(
                "👑 MOTI GO - ADMINISTRADOR:",
                usuario.uid
            );

        }
    );


    document
        .getElementById(
            "btnCerrarSesion"
        )
        .addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "../index.html";

                }
                catch (
                    error
                ) {

                    console.error(
                        "❌ MOTI GO: error cerrando sesión:",
                        error
                    );

                }

            }
        );

</script>

</body>

</html>
