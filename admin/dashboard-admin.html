<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOTI GO - Administración</title>

    <link
        rel="stylesheet"
        href="../css/moti-go.css"
    >

</head>

<body>

    <main>

        <h1>MOTI GO</h1>

        <h2>Panel de administración</h2>

        <p>
            Panel administrativo de MOTI GO
        </p>

        <button id="btnCerrarSesion">
            Cerrar sesión
        </button>

    </main>


    <script type="module">

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        import {
            app
        } from
        "../js/firebase-config.js";


        const auth =
            getAuth(app);


        onAuthStateChanged(
            auth,
            (
                usuario
            ) => {

                if (!usuario) {

                    window.location.href =
                        "../index.html";

                    return;

                }

                console.log(
                    "👑 MOTI GO - ADMINISTRADOR:",
                    usuario.uid
                );

            }
        );


        document
            .getElementById(
                "btnCerrarSesion"
            )
            .addEventListener(
                "click",
                async () => {

                    await signOut(auth);

                    window.location.href =
                        "../index.html";

                }
            );

    </script>

</body>

</html>
