<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#22C55E">

    <meta name="description"
          content="MOTI GO — Mandados, compras y entregas locales.">

    <title>MOTI GO</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Iconos -->
    <link rel="icon"
          type="image/png"
          href="assets/branding/favicon.png">

    <link rel="apple-touch-icon"
          href="assets/branding/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Estilos existentes -->
    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/main.css">

    <!-- Estilos propios de la pantalla inicial -->
    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(34, 197, 94, 0.12),
                    transparent 38%
                ),
                #ffffff;
            color: #0F172A;
        }

        .moti-go-home {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
        }

        .moti-go-card {
            width: 100%;
            max-width: 430px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            width: min(270px, 72vw);
            height: min(270px, 72vw);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-name {
            margin: 0;
            font-size: clamp(2.2rem, 10vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
            color: #0F172A;
        }

        .brand-name span {
            color: #22C55E;
        }

        .slogan {
            margin: 12px 0 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #475569;
        }

        .description {
            max-width: 320px;
            margin: 0 auto 30px;
            font-size: 0.84rem;
            line-height: 1.6;
            color: #64748B;
        }

        .service-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
        }

        .service-tag {
            padding: 7px 12px;
            border-radius: 999px;
            background: #F0FDF4;
            color: #15803D;
            font-size: 0.72rem;
            font-weight: 600;
            border: 1px solid #DCFCE7;
        }

        .btn-primary {
            width: 100%;
            max-width: 330px;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #22C55E,
                #16A34A
            );
            color: #ffffff;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            box-shadow:
                0 10px 25px rgba(34, 197, 94, 0.25);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:hover {
            box-shadow:
                0 14px 30px rgba(34, 197, 94, 0.32);
        }

        .version {
            margin: 24px 0 0;
            font-size: 0.68rem;
            color: #94A3B8;
            font-weight: 500;
        }

        .footer-text {
            margin-top: 6px;
            font-size: 0.68rem;
            color: #CBD5E1;
        }

        @media (max-height: 700px) {

            .moti-go-home {
                padding-top: 18px;
                padding-bottom: 18px;
            }

            .logo-wrapper {
                width: 190px;
                height: 190px;
                margin-bottom: 14px;
            }

            .description {
                margin-bottom: 20px;
            }

            .service-tags {
                margin-bottom: 20px;
            }
        }

    </style>

</head>

<body>

    <main class="moti-go-home">

        <section class="moti-go-card">

            <!-- LOGO -->
            <div class="logo-wrapper">

                <img
                    src="assets/branding/moti-go-logo.png"
                    alt="MOTI GO">

            </div>


            <!-- MARCA -->
            <h1 class="brand-name">
                MOTI <span>GO</span>
            </h1>


            <!-- ESLOGAN -->
            <p class="slogan">
                Mandados · Compras · Entregas
            </p>


            <!-- DESCRIPCIÓN -->
            <p class="description">
                Tú pide lo que necesitas.
                Nosotros nos encargamos de llevarlo hasta ti.
            </p>


            <!-- SERVICIOS -->
            <div class="service-tags">

                <span class="service-tag">
                    Mandados
                </span>

                <span class="service-tag">
                    Compras
                </span>

                <span class="service-tag">
                    Entregas
                </span>

            </div>


            <!-- INGRESAR -->
            <a
                href="pages/login.html"
                class="btn-primary">

                Iniciar sesión

            </a>


            <!-- VERSION -->
            <p class="version">
                MOTI GO · Versión inicial
            </p>

            <p class="footer-text">
                Tu ciudad, a un pedido de distancia.
            </p>

        </section>

    </main>


   <script>

    // ==========================================
    // SERVICE WORKER MOTI GO
    // ==========================================

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register(
                        "./service-worker.js"
                    )
                    .then(
                        (registration) => {

                            console.log(
                                "✅ Service Worker MOTI GO registrado:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        (error) => {

                            console.error(
                                "❌ Error registrando Service Worker MOTI GO:",
                                error
                            );

                        }
                    );

            }
        );

    }


    // ==========================================
    // 🎮 MOTI OFFLINE
    // ==========================================

    let motiOfflineAbierto =
        false;


    function abrirMotiOffline() {

        // Evitar abrirlo dos veces

        if (
            motiOfflineAbierto
        ) {

            return;

        }


        motiOfflineAbierto =
            true;


        console.log(
            "📡 MOTI GO: conexión perdida."
        );


        console.log(
            "🎮 MOTI GO: entrando en MOTI Offline..."
        );


        /*
         * Pequeña pantalla de transición.
         * No utilizamos alert() porque queremos
         * que se sienta como una función propia
         * de la PWA.
         */

        document.body.innerHTML = `

            <div
                id="motiOfflineTransition"
                style="
                    position:fixed;
                    inset:0;
                    z-index:999999;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#ffffff;
                    font-family:Poppins,sans-serif;
                    text-align:center;
                    padding:30px;
                "
            >

                <div>

                    <div
                        style="
                            font-size:52px;
                            margin-bottom:15px;
                        "
                    >
                        🎮
                    </div>


                    <h2
                        style="
                            margin:0;
                            color:#0F172A;
                            font-size:24px;
                        "
                    >
                        MOTI Offline
                    </h2>


                    <p
                        style="
                            margin:8px 0 0;
                            color:#64748B;
                            font-size:14px;
                        "
                    >
                        No hay conexión.
                        <br>
                        Mientras vuelve Internet...
                    </p>

                </div>

            </div>

        `;


        /*
         * Dejamos que el navegador termine
         * de mostrar la pantalla y después
         * abrimos el juego.
         */

        setTimeout(
            () => {

                window.location.href =
                    "moti_offline/index.html";

            },
            700
        );

    }


    // ==========================================
    // CONEXIÓN PERDIDA
    // ==========================================

    window.addEventListener(
        "offline",
        () => {

            abrirMotiOffline();

        }
    );


    // ==========================================
    // COMPROBACIÓN INICIAL
    // ==========================================

    /*
     * Esto también cubre el caso de que
     * el usuario abra MOTI directamente
     * sin conexión.
     */

    if (
        !navigator.onLine
    ) {

        abrirMotiOffline();

    }

</script>

</body>

</html>
