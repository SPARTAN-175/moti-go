<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#07100b">

<title>MOTI CITY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07100b;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:1200px;
    overflow:hidden;
    background:#304d32;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:10px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudLeft{
    display:flex;
    gap:7px;
}

.hudBox{
    padding:8px 11px;
    border-radius:12px;
    background:rgba(5,12,8,.82);
    color:white;
    border:1px solid rgba(255,255,255,.12);
    font-size:12px;
    font-weight:800;
    backdrop-filter:blur(7px);
}

.money{
    color:#ffd447;
}

.timer{
    color:#ffb454;
}

#mission{
    position:absolute;
    top:61px;
    left:50%;
    transform:translateX(-50%);
    z-index:19;

    min-width:250px;
    max-width:80%;

    padding:9px 13px;

    text-align:center;

    background:rgba(5,12,8,.88);
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;

    color:#fff;
    font-size:12px;

    pointer-events:none;
}

#mission strong{
    color:#37db80;
}

/* =========================
   MINIMAPA
========================= */

#miniMap{
    position:absolute;
    right:12px;
    top:62px;

    width:145px;
    height:110px;

    z-index:18;

    overflow:hidden;

    border-radius:13px;
    background:rgba(5,12,8,.9);
    border:1px solid rgba(255,255,255,.15);
}

#miniCanvas{
    width:100%;
    height:100%;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
    position:absolute;
    left:22px;
    bottom:25px;

    width:145px;
    height:145px;

    z-index:30;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,.07) 42%,
            rgba(0,0,0,.22) 43%,
            rgba(0,0,0,.22) 100%
        );

    border:2px solid
        rgba(255,255,255,.13);

    box-shadow:
        inset 0 5px 20px rgba(0,0,0,.35);

    touch-action:none;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:62px;
    height:62px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #50585d,
            #252b2f 55%,
            #111518 100%
        );

    border:3px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 8px 15px rgba(0,0,0,.45);

    pointer-events:none;
}

/* =========================
   BOTONES XBOX
========================= */

#xbox{
    position:absolute;
    right:24px;
    bottom:25px;

    width:190px;
    height:160px;

    z-index:30;
}

.xbtn{
    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;
    font-weight:900;

    color:white;

    border:2px solid
        rgba(255,255,255,.17);

    box-shadow:
        0 7px 12px rgba(0,0,0,.4);

    user-select:none;
}

.xbtn:active{
    transform:scale(.88);
}

#btnY{
    top:0;
    left:66px;
    background:#d8a928;
}

#btnX{
    top:50px;
    left:10px;
    background:#2475c9;
}

#btnB{
    top:50px;
    right:10px;
    background:#c93939;
}

#btnA{
    bottom:0;
    left:66px;
    background:#279b59;
}

/* =========================
   PANTALLAS
========================= */

.screen{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            rgba(2,8,4,.55),
            rgba(2,8,4,.94)
        );
}

.panel{
    width:min(91%,450px);

    padding:30px 25px;

    border-radius:25px;

    text-align:center;

    background:
        rgba(8,18,12,.95);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:white;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);
}

.logo{
    font-size:55px;
    font-weight:900;
    letter-spacing:-5px;
}

.logo span{
    color:#29d47d;
}

.title{
    font-size:21px;
    font-weight:900;
}

.subtitle{
    margin-top:8px;
    color:#9ca99f;
    line-height:1.5;
}

.infoGrid{
    margin-top:20px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:9px;
}

.info{
    padding:12px;

    background:
        rgba(255,255,255,.05);

    border-radius:12px;

    color:#b7c2ba;

    font-size:12px;
}

.bigButton{
    width:100%;

    margin-top:20px;

    padding:16px;

    border:0;
    border-radius:15px;

    background:#29d47d;
    color:#04100a;

    font-size:17px;
    font-weight:900;
}

.bigButton:active{
    transform:scale(.97);
}

.hidden{
    display:none!important;
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;

    left:50%;
    bottom:205px;

    transform:
        translate(-50%,20px);

    z-index:45;

    padding:11px 17px;

    background:
        rgba(4,10,7,.92);

    border-radius:13px;

    color:white;

    font-size:13px;
    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    #joystick{
        width:125px;
        height:125px;
        left:15px;
        bottom:17px;
    }

    #stick{
        width:55px;
        height:55px;
    }

    #xbox{
        right:12px;
        bottom:17px;
        transform:scale(.88);
        transform-origin:right bottom;
    }

    #miniMap{
        width:115px;
        height:90px;
    }

}
</style>
</head>

<script>

/* =========================================================
   MOTI CITY
   ========================================================= */


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const miniCanvas =
    document.getElementById("miniCanvas");

const miniCtx =
    miniCanvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=canvas.width=
        canvas.clientWidth;

    H=canvas.height=
        canvas.clientHeight;

    miniCanvas.width=145;
    miniCanvas.height=110;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   MUNDO
========================= */

const WORLD_W=4800;
const WORLD_H=3600;


/* =========================
   CALLES
========================= */

const roads=[

    {x:0,y:500,w:4800,h:190},

    {x:0,y:1700,w:4800,h:190},

    {x:0,y:2900,w:4800,h:190},

    {x:480,y:0,w:190,h:3600},

    {x:1550,y:0,w:190,h:3600},

    {x:2700,y:0,w:190,h:3600},

    {x:3850,y:0,w:190,h:3600},

    {x:670,y:1050,w:880,h:150},

    {x:1740,y:2300,w:960,h:150},

    {x:2990,y:850,w:860,h:150}

];


/* =========================
   EDIFICIOS
========================= */

const buildings=[];

function pointOnRoad(x,y){

    return roads.some(r=>
        x>r.x &&
        x<r.x+r.w &&
        y>r.y &&
        y<r.y+r.h
    );

}


function generateBuildings(){

    buildings.length=0;

    for(
        let y=70;
        y<WORLD_H-70;
        y+=145
    ){

        for(
            let x=70;
            x<WORLD_W-70;
            x+=155
        ){

            let bx=
                x+
                Math.random()*35;

            let by=
                y+
                Math.random()*30;

            let bw=
                85+
                Math.random()*45;

            let bh=
                70+
                Math.random()*45;


            const centerX=
                bx+bw/2;

            const centerY=
                by+bh/2;


            if(
                !pointOnRoad(
                    centerX,
                    centerY
                )
            ){

                buildings.push({

                    x:bx,
                    y:by,
                    w:bw,
                    h:bh,

                    wall:
                        [
                            "#d9c7a5",
                            "#c9d2b9",
                            "#d5b79e",
                            "#bfc9c5",
                            "#dfcfb4"
                        ][
                            Math.floor(
                                Math.random()*5
                            )
                        ],

                    roof:
                        [
                            "#985b4b",
                            "#754d43",
                            "#53636a",
                            "#7b624d"
                        ][
                            Math.floor(
                                Math.random()*4
                            )
                        ]

                });

            }

        }

    }

}

generateBuildings();


/* =========================
   CASAS
========================= */

const houses=[
    {x:210,y:300,name:"Casa de Ana"},
    {x:890,y:300,name:"Casa de Luis"},
    {x:1210,y:820,name:"Casa de María"},
    {x:2050,y:330,name:"Casa de Carlos"},
    {x:2380,y:780,name:"Casa de Sofía"},
    {x:3200,y:350,name:"Casa de José"},
    {x:4300,y:350,name:"Casa de Pedro"},
    {x:760,y:1420,name:"Casa de Elena"},
    {x:1200,y:1500,name:"Casa de Diego"},
    {x:2080,y:1450,name:"Casa de Laura"},
    {x:3000,y:1450,name:"Casa de Miguel"},
    {x:3500,y:1450,name:"Casa de Rosa"},
    {x:4300,y:1450,name:"Casa de Juan"},
    {x:260,y:2450,name:"Casa de Carlos"},
    {x:900,y:2450,name:"Casa de Ana"},
    {x:1300,y:2500,name:"Casa de Luis"},
    {x:2000,y:2500,name:"Casa de Sofía"},
    {x:3200,y:2450,name:"Casa de José"},
    {x:3500,y:2600,name:"Casa de Pedro"},
    {x:4300,y:2450,name:"Casa de María"},
    {x:850,y:3300,name:"Casa de Diego"},
    {x:2100,y:3300,name:"Casa de Laura"},
    {x:3300,y:3300,name:"Casa de Miguel"},
    {x:4300,y:3300,name:"Casa de Rosa"}
];


/* =========================
   COMERCIOS
========================= */

const stores=[
    {x:250,y:595,name:"Abarrotes Don Luis"},
    {x:900,y:595,name:"Tienda La Esperanza"},
    {x:2100,y:595,name:"Farmacia"},
    {x:3300,y:595,name:"Mini Súper"},
    {x:4300,y:1780,name:"Papelería"},
    {x:900,y:2980,name:"Tienda Central"},
    {x:3000,y:2980,name:"Supermercado"},
    {x:4300,y:2980,name:"Farmacia MOTI"}
];


/* =========================
   PERSONAS
========================= */

const people=[];

function generatePeople(){

    people.length=0;

    for(let i=0;i<65;i++){

        const horizontal=
            Math.random()>.5;

        let x;
        let y;
        let angle;


        if(horizontal){

            const r=
                roads[
                    [
                        0,
                        1,
                        2
                    ][
                        Math.floor(
                            Math.random()*3
                        )
                    ]
                ];

            x=
                r.x+
                100+
                Math.random()*
                (r.w-200);

            y=
                r.y+
                (
                    Math.random()>.5
                    ? 35
                    : r.h-35
                );

            angle=
                Math.random()>.5
                ? 0
                : Math.PI;

        }else{

            const r=
                [
                    roads[3],
                    roads[4],
                    roads[5],
                    roads[6]
                ][
                    Math.floor(
                        Math.random()*4
                    )
                ];

            x=
                r.x+
                (
                    Math.random()>.5
                    ? 35
                    : r.w-35
                );

            y=
                Math.random()*
                WORLD_H;

            angle=
                Math.random()>.5
                ? Math.PI/2
                : -Math.PI/2;

        }


        people.push({

            x,
            y,
            angle,

            speed:
                .25+
                Math.random()*.35,

            phase:
                Math.random()*10

        });

    }

}

generatePeople();


/* =========================
   TRÁFICO
========================= */

const traffic=[];

const trafficColors=[
    "#e74c3c",
    "#3498db",
    "#f1c40f",
    "#9b59b6",
    "#f4f4f4",
    "#2ecc71",
    "#34495e"
];


/* =========================
   JUGADOR
========================= */

const player={

    x:300,
    y:595,

    angle:0,

    speed:0,

    maxSpeed:5.5,

    acceleration:.19,

    friction:.07,

    rotation:.075,

    boost:false,

    boostEnergy:100,

    health:100,

    invincible:0

};


/* =========================
   CÁMARA
========================= */

const camera={
    x:0,
    y:0
};


/* =========================
   ESTADO
========================= */

let running=false;

let money=0;

let deliveries=0;

let orders=0;

let mission=null;

let missionTime=90;

let particles=[];

let trafficTimer=0;

let hornTimer=0;

let bestMoney=
    parseInt(
        localStorage.getItem(
            "motiCityBest"
        ) || "0"
    );

document.getElementById(
    "bestStart"
).textContent=
    "$"+bestMoney;


/* =========================
   CONTROLES
========================= */

const keys={
    up:false,
    down:false,
    left:false,
    right:false,
    boost:false
};


/* =========================
   UTILIDADES
========================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function dist(
    x1,y1,x2,y2
){

    return Math.hypot(
        x1-x2,
        y1-y2
    );

}


/* =========================
   MISIÓN
========================= */

function newMission(){

    const store=
        stores[
            Math.floor(
                Math.random()*
                stores.length
            )
        ];


    let house;

    do{

        house=
            houses[
                Math.floor(
                    Math.random()*
                    houses.length
                )
            ];

    }while(
        dist(
            store.x,
            store.y,
            house.x,
            house.y
        )<650
    );


    mission={

        store,
        house,

        state:"pickup",

        reward:
            25+
            Math.floor(
                Math.random()*45
            )

    };


    missionTime=90;

    orders++;

    updateMission();

}


function updateMission(){

    if(!mission)
        return;


    const text=
        document.getElementById(
            "missionText"
        );


    if(
        mission.state==="pickup"
    ){

        text.innerHTML=
            "📦 Recoge en <strong>"+
            mission.store.name+
            "</strong>";

    }else{

        text.innerHTML=
            "🏠 Entrega en <strong>"+
            mission.house.name+
            "</strong>";

    }

}


/* =========================
   TOAST
========================= */

let toastTimeout;


function toast(text){

    const el=
        document.getElementById(
            "toast"
        );

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(
        toastTimeout
    );

    toastTimeout=
        setTimeout(
            ()=>{
                el.classList.remove(
                    "show"
                );
            },
            1600
        );

}


/* =========================
   MOVIMIENTO
========================= */

function updatePlayer(){

    let max=
        player.maxSpeed;


    if(
        keys.boost &&
        player.boostEnergy>0
    ){

        player.boost=true;

        max=9;

        player.boostEnergy-=.9;

    }else{

        player.boost=false;

        player.boostEnergy+=.3;

    }


    player.boostEnergy=
        clamp(
            player.boostEnergy,
            0,
            100
        );


    if(keys.up)
        player.speed+=
            player.acceleration;


    else if(keys.down)
        player.speed-=
            player.acceleration*.8;


    else{

        if(player.speed>0)
            player.speed=
                Math.max(
                    0,
                    player.speed-
                    player.friction
                );

        if(player.speed<0)
            player.speed=
                Math.min(
                    0,
                    player.speed+
                    player.friction
                );

    }


    player.speed=
        clamp(
            player.speed,
            -2.5,
            max
        );


    if(
        Math.abs(player.speed)>.15
    ){

        const direction=
            player.speed>=0
            ? 1
            : -1;

        const turn=
            player.rotation*
            Math.min(
                1,
                Math.abs(player.speed)/3
            );

        if(keys.left)
            player.angle-=
                turn*direction;

        if(keys.right)
            player.angle+=
                turn*direction;

    }


    const oldX=player.x;
    const oldY=player.y;


    player.x+=
        Math.cos(
            player.angle
        )*
        player.speed;

    player.y+=
        Math.sin(
            player.angle
        )*
        player.speed;


    player.x=
        clamp(
            player.x,
            25,
            WORLD_W-25
        );

    player.y=
        clamp(
            player.y,
            25,
            WORLD_H-25
        );


    if(collidesBuilding()){

        player.x=oldX;
        player.y=oldY;

        player.speed*=-.25;

        crashEffect();

    }


    updateCamera();

}


/* =========================
   COLISIÓN EDIFICIOS
========================= */

function collidesBuilding(){

    for(
        const b of buildings
    ){

        if(
            player.x>b.x-18 &&
            player.x<b.x+b.w+18 &&
            player.y>b.y-18 &&
            player.y<b.y+b.h+18
        ){

            return true;

        }

    }

    return false;

}


/* =========================
   TRÁFICO
========================= */

function spawnTraffic(){

    const horizontal=
        Math.random()>.5;


    if(horizontal){

        const road=
            [
                roads[0],
                roads[1],
                roads[2]
            ][
                Math.floor(
                    Math.random()*3
                )
            ];


        const direction=
            Math.random()>.5
            ? 1
            : -1;


        traffic.push({

            x:
                direction>0
                ? -100
                : WORLD_W+100,

            y:
                road.y+
                (
                    direction>0
                    ? road.h*.35
                    : road.h*.65
                ),

            angle:
                direction>0
                ? 0
                : Math.PI,

            speed:
                1.7+
                Math.random()*2.2,

            color:
                trafficColors[
                    Math.floor(
                        Math.random()*
                        trafficColors.length
                    )
                ],

            width:30,
            height:55

        });

    }else{

        const road=
            [
                roads[3],
                roads[4],
                roads[5],
                roads[6]
            ][
                Math.floor(
                    Math.random()*4
                )
            ];


        const direction=
            Math.random()>.5
            ? 1
            : -1;


        traffic.push({

            x:
                road.x+
                (
                    direction>0
                    ? road.w*.35
                    : road.w*.65
                ),

            y:
                direction>0
                ? -100
                : WORLD_H+100,

            angle:
                direction>0
                ? Math.PI/2
                : -Math.PI/2,

            speed:
                1.7+
                Math.random()*2.2,

            color:
                trafficColors[
                    Math.floor(
                        Math.random()*
                        trafficColors.length
                    )
                ],

            width:30,
            height:55

        });

    }

}


/* =========================
   ACTUALIZAR TRÁFICO
========================= */

function updateTraffic(){

    trafficTimer--;

    if(
        trafficTimer<=0
    ){

        spawnTraffic();

        trafficTimer=
            45+
            Math.random()*45;

    }


    traffic.forEach(t=>{

        t.x+=
            Math.cos(
                t.angle
            )*
            t.speed;

        t.y+=
            Math.sin(
                t.angle
            )*
            t.speed;

    });


    traffic=
        traffic.filter(
            t=>
                t.x>-150 &&
                t.x<WORLD_W+150 &&
                t.y>-150 &&
                t.y<WORLD_H+150
        );


    if(
        player.invincible>0
    ){

        player.invincible--;

    }


    /*
        CHOQUE
    */

    for(
        const t of traffic
    ){

        if(
            dist(
                player.x,
                player.y,
                t.x,
                t.y
            )<38
        ){

            if(
                player.invincible<=0
            ){

                crashWithCar(t);

            }

        }

    }

}


/* =========================
   CHOQUE
========================= */

function crashWithCar(car){

    player.invincible=70;

    player.health-=35;

    player.speed*=-.55;

    player.x+=
        Math.cos(
            car.angle+
            Math.PI/2
        )*20;

    player.y+=
        Math.sin(
            car.angle+
            Math.PI/2
        )*20;


    money=
        Math.max(
            0,
            money-5
        );


    createParticles(
        player.x,
        player.y,
        25,
        "#ff6347"
    );


    toast(
        "💥 ¡CHOCASTE! -$5"
    );


    if(
        player.health<=0
    ){

        endGame();

    }

}

/* =========================
   PERSONAS
========================= */

function updatePeople(){

    people.forEach(p=>{

        p.phase+=.04;

        p.x+=
            Math.cos(
                p.angle
            )*
            p.speed;

        p.y+=
            Math.sin(
                p.angle
            )*
            p.speed;


        if(
            p.x<20 ||
            p.x>WORLD_W-20 ||
            p.y<20 ||
            p.y>WORLD_H-20
        ){

            p.angle+=Math.PI;

/* =========================
   MISIÓN
========================= */

function checkMission(){

    if(!mission)
        return;


    const target=
        mission.state==="pickup"
        ? mission.store
        : mission.house;


    if(
        dist(
            player.x,
            player.y,
            target.x,
            target.y
        )<70
    ){

        if(
            mission.state==="pickup"
        ){

            mission.state=
                "delivery";

            missionTime=90;

            updateMission();

            toast(
                "📦 Pedido recogido"
            );

        }else{

            const reward=
                mission.reward+
                Math.floor(
                    missionTime*.45
                );


            money+=reward;

            deliveries++;


            createParticles(
                player.x,
                player.y,
                30,
                "#ffd447"
            );


            toast(
                "💰 Entrega completada +$"+
                reward
            );


            mission=null;


            setTimeout(
                ()=>{
                    if(running)
                        newMission();
                },
                650
            );

        }

    }

}

/* =========================
   PARTÍCULAS
========================= */

function createParticles(
    x,
    y,
    amount,
    color="#ffd447"
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                25+
                Math.random()*30,

            color

        });

    }

}


function updateParticles(){

    particles.forEach(p=>{

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.08;

        p.life--;

    });


    particles=
        particles.filter(
            p=>p.life>0
        );

}


function drawParticles(){

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );


    particles.forEach(p=>{

        ctx.globalAlpha=
            p.life/55;

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    });


    ctx.globalAlpha=1;

    ctx.restore();

}

/* =========================
   LOOP
========================= */

let previous=
    performance.now();


function loop(now){

    const delta=
        Math.min(
            50,
            now-previous
        );

    previous=now;


    if(running){

        updatePlayer();

        updateTraffic();

        updatePeople();

        updateParticles();

        checkMission();


        if(mission){

            missionTime-=
                delta/1000;


            if(
                missionTime<=0
            ){

                toast(
                    "⏱️ Se acabó el tiempo"
                );

                mission=null;

                setTimeout(
                    ()=>{
                        if(running)
                            newMission();
                    },
                    700
                );

            }

        }


        updateHUD();

    }


    drawWorld();

    drawParticles();

    drawMiniMap();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);

/* =========================
   JOYSTICK
========================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joystickActive=false;


function joystickMove(
    e
){

    const rect=
        joystick.getBoundingClientRect();


    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;


    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;


    const max=
        rect.width*.32;


    const length=
        Math.hypot(dx,dy);


    if(length>max){

        dx=
            dx/length*max;

        dy=
            dy/length*max;

    }


    stick.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;


    const nx=
        dx/max;

    const ny=
        dy/max;


    keys.left=
        nx<-.25;

    keys.right=
        nx>.25;

    keys.up=
        ny<-.25;

    keys.down=
        ny>.35;

}


joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);

    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(joystickActive)
            joystickMove(e);

    }
);


function joystickEnd(){

    joystickActive=false;

    keys.left=false;
    keys.right=false;
    keys.up=false;
    keys.down=false;

    stick.style.transform=
        "translate(-50%,-50%)";

}


joystick.addEventListener(
    "pointerup",
    joystickEnd
);

joystick.addEventListener(
    "pointercancel",
    joystickEnd
);


/* =========================
   BOTONES XBOX
========================= */


/*
    A = acelerar
    B = frenar
    X = bocina
    Y = turbo
*/


function buttonHold(
    id,
    down,
    up
){

    const btn=
        document.getElementById(
            id
        );


    btn.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            down();

        }
    );


    btn.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            up();

        }
    );


    btn.addEventListener(
        "pointercancel",
        up
    );


    btn.addEventListener(
        "pointerleave",
        up
    );

}


buttonHold(
    "btnA",
    ()=>{
        keys.up=true;
    },
    ()=>{
        keys.up=false;
    }
);


buttonHold(
    "btnB",
    ()=>{
        keys.down=true;
    },
    ()=>{
        keys.down=false;
    }
);


buttonHold(
    "btnY",
    ()=>{
        keys.boost=true;
    },
    ()=>{
        keys.boost=false;
    }
);

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowUp" ||
            e.key.toLowerCase()==="w"
        )
            keys.up=true;


        if(
            e.key==="ArrowDown" ||
            e.key.toLowerCase()==="s"
        )
            keys.down=true;


        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        )
            keys.left=true;


        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        )
            keys.right=true;


        if(
            e.code==="Space"
        )
            keys.boost=true;

    }
);


document.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowUp" ||
            e.key.toLowerCase()==="w"
        )
            keys.up=false;


        if(
            e.key==="ArrowDown" ||
            e.key.toLowerCase()==="s"
        )
            keys.down=false;


        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        )
            keys.left=false;


        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        )
            keys.right=false;


        if(
            e.code==="Space"
        )
            keys.boost=false;

    }
);

/* =========================
   ROUND RECT
========================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );

    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );

    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );

    ctx.closePath();

}
