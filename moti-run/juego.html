<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no"
>

<meta name="theme-color" content="#07110b">

<title>MOTI CITY</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07110b;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:1300px;
    overflow:hidden;
    background:#416c43;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;
    top:0;
    left:0;

    width:100%;

    padding:10px;

    z-index:20;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hudGroup{
    display:flex;
    gap:7px;
}

.hudBox{
    background:rgba(4,11,7,.86);

    border:1px solid
        rgba(255,255,255,.13);

    border-radius:12px;

    padding:8px 11px;

    color:white;

    font-size:12px;
    font-weight:800;

    backdrop-filter:blur(8px);
}

.money{
    color:#ffd447;
}

.timer{
    color:#ffb24d;
}

/* =========================================================
   MISSION
========================================================= */

#mission{
    position:absolute;

    top:58px;
    left:50%;

    transform:translateX(-50%);

    z-index:19;

    min-width:240px;
    max-width:75%;

    padding:9px 13px;

    border-radius:13px;

    background:rgba(4,11,7,.88);

    border:1px solid
        rgba(255,255,255,.12);

    color:white;

    text-align:center;

    font-size:12px;

    pointer-events:none;
}

#mission strong{
    color:#36dc80;
}

/* =========================================================
   MINIMAPA
========================================================= */

#miniMap{
    position:absolute;

    top:60px;
    right:12px;

    width:145px;
    height:110px;

    z-index:18;

    border-radius:13px;

    overflow:hidden;

    background:rgba(4,11,7,.9);

    border:1px solid
        rgba(255,255,255,.15);
}

#miniCanvas{
    width:100%;
    height:100%;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:absolute;

    left:22px;
    bottom:22px;

    width:145px;
    height:145px;

    z-index:30;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.12) 0 36%,
            rgba(0,0,0,.12) 37% 60%,
            rgba(0,0,0,.3) 61% 100%
        );

    border:2px solid
        rgba(255,255,255,.14);

    box-shadow:
        inset 0 6px 22px rgba(0,0,0,.35);

    touch-action:none;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:61px;
    height:61px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #5c6468,
            #292f33 55%,
            #111416
        );

    border:3px solid
        rgba(255,255,255,.17);

    box-shadow:
        0 8px 15px rgba(0,0,0,.5);

    pointer-events:none;
}

/* =========================================================
   XBOX BUTTONS
========================================================= */

#xbox{
    position:absolute;

    right:22px;
    bottom:22px;

    width:190px;
    height:165px;

    z-index:30;
}

.xbtn{
    position:absolute;

    width:59px;
    height:59px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:20px;
    font-weight:900;

    border:2px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 7px 14px rgba(0,0,0,.45);

    user-select:none;
}

.xbtn:active{
    transform:scale(.87);
}

#btnY{
    top:0;
    left:65px;
    background:#d6a929;
}

#btnX{
    top:52px;
    left:5px;
    background:#2777c9;
}

#btnB{
    top:52px;
    right:5px;
    background:#c93c3c;
}

#btnA{
    bottom:0;
    left:65px;
    background:#299b5b;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
    position:absolute;

    left:50%;
    bottom:205px;

    transform:
        translate(-50%,20px);

    z-index:40;

    padding:11px 16px;

    background:
        rgba(4,10,7,.93);

    border-radius:13px;

    color:white;

    font-size:13px;
    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   PANTALLAS
========================================================= */

.screen{
    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            rgba(2,8,4,.55),
            rgba(2,8,4,.94)
        );
}

.panel{
    width:min(91%,450px);

    padding:30px 25px;

    border-radius:25px;

    text-align:center;

    background:
        rgba(8,18,12,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:white;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);
}

.logo{
    font-size:55px;

    font-weight:900;

    letter-spacing:-5px;
}

.logo span{
    color:#29d47d;
}

.title{
    margin-top:2px;

    font-size:21px;

    font-weight:900;
}

.subtitle{
    margin-top:8px;

    color:#9ca99f;

    line-height:1.5;
}

.infoGrid{
    margin-top:20px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}

.info{
    padding:12px;

    background:
        rgba(255,255,255,.05);

    border-radius:12px;

    color:#b7c2ba;

    font-size:12px;
}

.bigButton{
    width:100%;

    margin-top:20px;

    padding:16px;

    border:0;

    border-radius:15px;

    background:#29d47d;

    color:#04100a;

    font-size:17px;

    font-weight:900;
}

.bigButton:active{
    transform:scale(.97);
}

.hidden{
    display:none!important;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    #joystick{
        width:125px;
        height:125px;

        left:14px;
        bottom:15px;
    }

    #stick{
        width:54px;
        height:54px;
    }

    #xbox{
        right:7px;
        bottom:12px;

        transform:scale(.86);

        transform-origin:
            right bottom;
    }

    #miniMap{
        width:115px;
        height:88px;
    }

}

</style>
</head>


<body>

<script>

/* =========================================================
   MOTI CITY
   V2
========================================================= */


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const miniCanvas =
    document.getElementById("miniCanvas");

const miniCtx =
    miniCanvas.getContext("2d");

let W=0;
let H=0;


function resize(){

    W =
        canvas.width =
        canvas.clientWidth;

    H =
        canvas.height =
        canvas.clientHeight;

    miniCanvas.width=145;
    miniCanvas.height=110;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   ZOOM
========================================================= */

/*
    Menor número = más alejado.

    0.60 permite ver mucha más ciudad
    alrededor de la moto.
*/

const ZOOM=0.60;


/* =========================================================
   MUNDO
========================================================= */

const WORLD_W=5200;
const WORLD_H=3900;


/* =========================================================
   CALLES
========================================================= */

const roads=[

    {
        x:0,
        y:500,
        w:WORLD_W,
        h:190
    },

    {
        x:0,
        y:1750,
        w:WORLD_W,
        h:190
    },

    {
        x:0,
        y:3000,
        w:WORLD_W,
        h:190
    },

    {
        x:500,
        y:0,
        w:190,
        h:WORLD_H
    },

    {
        x:1600,
        y:0,
        w:190,
        h:WORLD_H
    },

    {
        x:2800,
        y:0,
        w:190,
        h:WORLD_H
    },

    {
        x:4000,
        y:0,
        w:190,
        h:WORLD_H
    },

    {
        x:690,
        y:1050,
        w:910,
        h:145
    },

    {
        x:1790,
        y:2300,
        w:1010,
        h:145
    },

    {
        x:2990,
        y:850,
        w:1010,
        h:145
    }

];


/* =========================================================
   UTILIDADES
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(
    x1,
    y1,
    x2,
    y2
){

    return Math.hypot(
        x1-x2,
        y1-y2
    );

}


function pointOnRoad(
    x,
    y
){

    return roads.some(
        r=>
            x>r.x &&
            x<r.x+r.w &&
            y>r.y &&
            y<r.y+r.h
    );

}


/* =========================================================
   EDIFICIOS
========================================================= */

const buildings=[];


function generateBuildings(){

    buildings.length=0;


    for(
        let y=70;
        y<WORLD_H-70;
        y+=150
    ){

        for(
            let x=70;
            x<WORLD_W-70;
            x+=160
        ){

            const bx=
                x+
                Math.random()*35;

            const by=
                y+
                Math.random()*30;

            const bw=
                85+
                Math.random()*45;

            const bh=
                70+
                Math.random()*45;


            if(
                !pointOnRoad(
                    bx+bw/2,
                    by+bh/2
                )
            ){

                buildings.push({

                    x:bx,
                    y:by,

                    w:bw,
                    h:bh,

                    wall:[
                        "#d7c3a1",
                        "#c6d0b8",
                        "#d4b39b",
                        "#bcc7c4",
                        "#dfcfb1"
                    ][
                        Math.floor(
                            Math.random()*5
                        )
                    ],

                    roof:[
                        "#92594b",
                        "#754b42",
                        "#53616a",
                        "#7c604c"
                    ][
                        Math.floor(
                            Math.random()*4
                        )
                    ]

                });

            }

        }

    }

}

generateBuildings();


/* =========================================================
   CASAS DE DESTINO
========================================================= */

const houses=[

    {x:210,y:300,name:"Casa de Ana"},
    {x:900,y:300,name:"Casa de Luis"},
    {x:1220,y:820,name:"Casa de María"},
    {x:2100,y:320,name:"Casa de Carlos"},
    {x:2400,y:790,name:"Casa de Sofía"},
    {x:3250,y:330,name:"Casa de José"},
    {x:4550,y:350,name:"Casa de Pedro"},

    {x:780,y:1400,name:"Casa de Elena"},
    {x:1240,y:1510,name:"Casa de Diego"},
    {x:2100,y:1450,name:"Casa de Laura"},
    {x:3100,y:1450,name:"Casa de Miguel"},
    {x:3550,y:1500,name:"Casa de Rosa"},
    {x:4550,y:1450,name:"Casa de Juan"},

    {x:250,y:2480,name:"Casa de Carlos"},
    {x:900,y:2480,name:"Casa de Ana"},
    {x:1350,y:2500,name:"Casa de Luis"},
    {x:2100,y:2500,name:"Casa de Sofía"},
    {x:3250,y:2470,name:"Casa de José"},
    {x:3600,y:2630,name:"Casa de Pedro"},
    {x:4550,y:2470,name:"Casa de María"},

    {x:850,y:3400,name:"Casa de Diego"},
    {x:2150,y:3400,name:"Casa de Laura"},
    {x:3350,y:3400,name:"Casa de Miguel"},
    {x:4550,y:3400,name:"Casa de Rosa"}

];


/* =========================================================
   TIENDAS
========================================================= */

const stores=[

    {
        x:250,
        y:595,
        name:"Abarrotes Don Luis"
    },

    {
        x:900,
        y:595,
        name:"Tienda La Esperanza"
    },

    {
        x:2100,
        y:595,
        name:"Farmacia"
    },

    {
        x:3300,
        y:595,
        name:"Mini Súper"
    },

    {
        x:4550,
        y:1780,
        name:"Papelería"
    },

    {
        x:900,
        y:3090,
        name:"Tienda Central"
    },

    {
        x:3100,
        y:3090,
        name:"Supermercado"
    },

    {
        x:4550,
        y:3090,
        name:"Farmacia MOTI"
    }

];


/* =========================================================
   PERSONAS
========================================================= */

const people=[];


function generatePeople(){

    people.length=0;


    for(
        let i=0;
        i<85;
        i++
    ){

        const horizontal=
            Math.random()>.5;


        let x;
        let y;
        let angle;


        if(horizontal){

            const r=
                [
                    roads[0],
                    roads[1],
                    roads[2]
                ][
                    Math.floor(
                        Math.random()*3
                    )
                ];


            x=
                100+
                Math.random()*
                (WORLD_W-200);


            y=
                r.y+
                (
                    Math.random()>.5
                    ? 30
                    : r.h-30
                );


            angle=
                Math.random()>.5
                ? 0
                : Math.PI;

        }else{

            const r=
                [
                    roads[3],
                    roads[4],
                    roads[5],
                    roads[6]
                ][
                    Math.floor(
                        Math.random()*4
                    )
                ];


            x=
                r.x+
                (
                    Math.random()>.5
                    ? 30
                    : r.w-30
                );


            y=
                100+
                Math.random()*
                (WORLD_H-200);


            angle=
                Math.random()>.5
                ? Math.PI/2
                : -Math.PI/2;

        }


        people.push({

            x:x,
            y:y,

            angle:angle,

            speed:
                .25+
                Math.random()*.35

        });

    }

}

generatePeople();


/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:300,
    y:595,

    angle:0,

    speed:0,

    maxSpeed:5.8,

    acceleration:.18,

    friction:.075,

    rotation:.075,

    boost:false,

    boostEnergy:100,

    health:100,

    invincible:0

};


/* =========================================================
   CÁMARA
========================================================= */

const camera={
    x:0,
    y:0
};


/* =========================================================
   TRÁFICO
========================================================= */

let traffic=[];

const trafficColors=[
    "#e74c3c",
    "#3498db",
    "#f1c40f",
    "#9b59b6",
    "#f4f4f4",
    "#2ecc71",
    "#34495e",
    "#e67e22"
];

let trafficTimer=10;


/* =========================================================
   JUEGO
========================================================= */

let running=false;

let money=0;

let deliveries=0;

let orders=0;

let mission=null;

let missionTime=90;

let particles=[];

let hornCooldown=0;


let bestMoney=
    parseInt(
        localStorage.getItem(
            "motiCityBest"
        ) || "0"
    );


document.getElementById(
    "bestStart"
).textContent=
    "$"+bestMoney;


/* =========================================================
   CONTROLES
========================================================= */

const keys={

    up:false,
    down:false,
    left:false,
    right:false,
    boost:false

};


/* =========================================================
   MISIÓN
========================================================= */

function createMission(){

    const store=
        stores[
            Math.floor(
                Math.random()*
                stores.length
            )
        ];


    let house;


    do{

        house=
            houses[
                Math.floor(
                    Math.random()*
                    houses.length
                )
            ];

    }while(

        distance(
            store.x,
            store.y,
            house.x,
            house.y
        )<600

    );


    mission={

        store:store,

        house:house,

        state:"pickup",

        reward:
            25+
            Math.floor(
                Math.random()*45
            )

    };


    missionTime=90;

    orders++;

    updateMission();

}


function updateMission(){

    if(!mission)
        return;


    const text=
        document.getElementById(
            "missionText"
        );


    if(
        mission.state==="pickup"
    ){

        text.innerHTML=
            "📦 Recoge en <strong>"+
            mission.store.name+
            "</strong>";

    }else{

        text.innerHTML=
            "🏠 Entrega en <strong>"+
            mission.house.name+
            "</strong>";

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimeout=null;


function showToast(
    text
){

    const el=
        document.getElementById(
            "toast"
        );


    el.textContent=text;

    el.classList.add("show");


    clearTimeout(
        toastTimeout
    );


    toastTimeout=
        setTimeout(
            ()=>{
                el.classList.remove(
                    "show"
                );
            },
            1700
        );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

    let maximum=
        player.maxSpeed;


    if(
        keys.boost &&
        player.boostEnergy>0
    ){

        player.boost=true;

        maximum=9;

        player.boostEnergy-=.9;

    }else{

        player.boost=false;

        player.boostEnergy+=.3;

    }


    player.boostEnergy=
        clamp(
            player.boostEnergy,
            0,
            100
        );


    if(keys.up){

        player.speed+=
            player.acceleration;

    }

    else if(keys.down){

        player.speed-=
            player.acceleration*.8;

    }

    else{

        if(player.speed>0){

            player.speed=
                Math.max(
                    0,
                    player.speed-
                    player.friction
                );

        }


        if(player.speed<0){

            player.speed=
                Math.min(
                    0,
                    player.speed+
                    player.friction
                );

        }

    }


    player.speed=
        clamp(
            player.speed,
            -2.5,
            maximum
        );


    if(
        Math.abs(player.speed)>.1
    ){

        const reverse=
            player.speed<0
            ? -1
            : 1;


        const turn=
            player.rotation*
            Math.min(
                1,
                Math.abs(player.speed)/3
            );


        if(keys.left)
            player.angle-=
                turn*reverse;


        if(keys.right)
            player.angle+=
                turn*reverse;

    }


    const oldX=player.x;
    const oldY=player.y;


    player.x+=
        Math.cos(
            player.angle
        )*
        player.speed;


    player.y+=
        Math.sin(
            player.angle
        )*
        player.speed;


    player.x=
        clamp(
            player.x,
            25,
            WORLD_W-25
        );


    player.y=
        clamp(
            player.y,
            25,
            WORLD_H-25
        );


    if(
        collidesBuilding()
    ){

        player.x=oldX;
        player.y=oldY;

        player.speed*=-.25;

        createParticles(
            player.x,
            player.y,
            8,
            "#cccccc"
        );

    }


    updateCamera();

}


/* =========================================================
   EDIFICIOS COLISIÓN
========================================================= */

function collidesBuilding(){

    for(
        const b of buildings
    ){

        if(

            player.x>b.x-17 &&
            player.x<b.x+b.w+17 &&
            player.y>b.y-17 &&
            player.y<b.y+b.h+17

        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

    const viewW=
        W/ZOOM;

    const viewH=
        H/ZOOM;


    camera.x=
        player.x-
        viewW/2;


    camera.y=
        player.y-
        viewH/2;


    camera.x=
        clamp(
            camera.x,
            0,
            WORLD_W-viewW
        );


    camera.y=
        clamp(
            camera.y,
            0,
            WORLD_H-viewH
        );

}


/* =========================================================
   TRÁFICO
========================================================= */

function spawnTraffic(){

    const horizontal=
        Math.random()>.5;


    if(horizontal){

        const r=
            [
                roads[0],
                roads[1],
                roads[2]
            ][
                Math.floor(
                    Math.random()*3
                )
            ];


        const direction=
            Math.random()>.5
            ? 1
            : -1;


        traffic.push({

            x:
                direction>0
                ? -100
                : WORLD_W+100,

            y:
                r.y+
                (
                    direction>0
                    ? r.h*.35
                    : r.h*.65
                ),

            angle:
                direction>0
                ? 0
                : Math.PI,

            speed:
                1.7+
                Math.random()*2.1,

            color:
                trafficColors[
                    Math.floor(
                        Math.random()*
                        trafficColors.length
                    )
                ]

        });

    }else{

        const r=
            [
                roads[3],
                roads[4],
                roads[5],
                roads[6]
            ][
                Math.floor(
                    Math.random()*4
                )
            ];


        const direction=
            Math.random()>.5
            ? 1
            : -1;


        traffic.push({

            x:
                r.x+
                (
                    direction>0
                    ? r.w*.35
                    : r.w*.65
                ),

            y:
                direction>0
                ? -100
                : WORLD_H+100,

            angle:
                direction>0
                ? Math.PI/2
                : -Math.PI/2,

            speed:
                1.7+
                Math.random()*2.1,

            color:
                trafficColors[
                    Math.floor(
                        Math.random()*
                        trafficColors.length
                    )
                ]

        });

    }

}


/* =========================================================
   UPDATE TRÁFICO
========================================================= */

function updateTraffic(){

    trafficTimer--;


    if(
        trafficTimer<=0
    ){

        spawnTraffic();

        trafficTimer=
            40+
            Math.random()*50;

    }


    traffic.forEach(
        car=>{

            car.x+=
                Math.cos(
                    car.angle
                )*
                car.speed;


            car.y+=
                Math.sin(
                    car.angle
                )*
                car.speed;

        }
    );


    traffic=
        traffic.filter(
            car=>
                car.x>-150 &&
                car.x<WORLD_W+150 &&
                car.y>-150 &&
                car.y<WORLD_H+150
        );


    if(
        player.invincible>0
    ){

        player.invincible--;

    }


    /*
        COLISIONES
    */

    traffic.forEach(
        car=>{

            if(
                distance(
                    player.x,
                    player.y,
                    car.x,
                    car.y
                )<38
            ){

                if(
                    player.invincible<=0
                ){

                    crash(car);

                }

            }

        }
    );

}


/* =========================================================
   CHOQUE
========================================================= */

function crash(
    car
){

    player.invincible=70;

    player.health-=35;

    player.speed*=-.55;


    const pushAngle=
        car.angle+
        Math.PI/2;


    player.x+=
        Math.cos(
            pushAngle
        )*20;


    player.y+=
        Math.sin(
            pushAngle
        )*20;


    money=
        Math.max(
            0,
            money-5
        );


    createParticles(
        player.x,
        player.y,
        28,
        "#ff6545"
    );


    showToast(
        "💥 ¡CHOQUE! -$5"
    );


    if(
        player.health<=0
    ){

        endGame();

    }

}


/* =========================================================
   PERSONAS
========================================================= */

function updatePeople(){

    people.forEach(
        p=>{

            p.x+=
                Math.cos(
                    p.angle
                )*
                p.speed;


            p.y+=
                Math.sin(
                    p.angle
                )*
                p.speed;


            if(
                p.x<20 ||
                p.x>WORLD_W-20 ||
                p.y<20 ||
                p.y>WORLD_H-20
            ){

                p.angle+=Math.PI;

            }

        }
    );

}


/* =========================================================
   CHECK MISIÓN
========================================================= */

function checkMission(){

    if(!mission)
        return;


    const target=
        mission.state==="pickup"
        ? mission.store
        : mission.house;


    if(
        distance(
            player.x,
            player.y,
            target.x,
            target.y
        )<70
    ){

        if(
            mission.state==="pickup"
        ){

            mission.state=
                "delivery";

            missionTime=90;

            updateMission();

            showToast(
                "📦 ¡Pedido recogido!"
            );

        }else{

            const reward=
                mission.reward+
                Math.floor(
                    missionTime*.45
                );


            money+=reward;

            deliveries++;


            createParticles(
                player.x,
                player.y,
                30,
                "#ffd447"
            );


            showToast(
                "💰 Entrega +$"+
                reward
            );


            mission=null;


            setTimeout(
                ()=>{
                    if(running)
                        createMission();
                },
                650
            );

        }

    }

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle="#477548";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    /*
        CENTRAMOS LA CÁMARA
        Y APLICAMOS ZOOM
    */

    ctx.translate(
        W/2,
        H/2
    );


    ctx.scale(
        ZOOM,
        ZOOM
    );


    ctx.translate(
        -camera.x,
        -camera.y
    );


    /*
        CALLES
    */

    roads.forEach(
        drawRoad
    );


    /*
        EDIFICIOS
    */

    buildings.forEach(
        drawBuilding
    );


    /*
        TIENDAS
    */

    stores.forEach(
        drawStore
    );


    /*
        CASAS
    */

    houses.forEach(
        drawHouse
    );


    /*
        PERSONAS
    */

    people.forEach(
        drawPerson
    );


    /*
        TRÁFICO
    */

    traffic.forEach(
        drawCar
    );


    /*
        MISIÓN
    */

    drawMissionMarker();


    /*
        MOTO
    */

    drawMotorcycle();


    ctx.restore();

}


/* =========================================================
   CARRETERA
========================================================= */

function drawRoad(r){

    ctx.fillStyle="#44494a";

    ctx.fillRect(
        r.x,
        r.y,
        r.w,
        r.h
    );


    /*
        banquetas
    */

    ctx.fillStyle="#aaa89d";


    if(
        r.w>r.h
    ){

        ctx.fillRect(
            r.x,
            r.y,
            r.w,
            10
        );

        ctx.fillRect(
            r.x,
            r.y+r.h-10,
            r.w,
            10
        );

    }else{

        ctx.fillRect(
            r.x,
            r.y,
            10,
            r.h
        );

        ctx.fillRect(
            r.x+r.w-10,
            r.y,
            10,
            r.h
        );

    }


    /*
        línea central
    */

    ctx.fillStyle="#d2cb8f";


    if(
        r.w>r.h
    ){

        for(
            let x=r.x;
            x<r.x+r.w;
            x+=75
        ){

            ctx.fillRect(
                x,
                r.y+r.h/2-2,
                38,
                4
            );

        }

    }else{

        for(
            let y=r.y;
            y<r.y+r.h;
            y+=75
        ){

            ctx.fillRect(
                r.x+r.w/2-2,
                y,
                4,
                38
            );

        }

    }

}

function drawMissionMarker(){

    const target=
        mission.state==="pickup"
        ? mission.store
        : mission.house;


    const pulse=
        40+
        Math.sin(
            Date.now()/180
        )*7;


    ctx.strokeStyle=
        mission.state==="pickup"
        ? "#ffd447"
        : "#ff8147";


    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.arc(
        target.x,
        target.y,

        0,
        Math.PI*2
    );

    ctx.stroke();

        ? "#ffd447"
        : "#ff8147";

        ? "RECOGER"
        : "ENTREGAR",
        target.x,
        target.y-48
    );

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createParticles(
    x,
    y,
    amount,
    color
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                25+
                Math.random()*30,

            color:color

        });

    }

}


function updateParticles(){

    particles.forEach(
        p=>{

            p.x+=p.vx;

            p.y+=p.vy;

            p.vy+=.08;

            p.life--;

        }
    );


    particles=
        particles.filter(
            p=>p.life>0
        );

}


function drawParticles(){

    ctx.save();

    ctx.translate(
        W/2,
        H/2
    );

    ctx.scale(
        ZOOM,
        ZOOM
    );

    ctx.translate(
        -camera.x,
        -camera.y
    );


    particles.forEach(
        p=>{

            ctx.globalAlpha=
                p.life/55;

            ctx.fillStyle=
                p.color;

            ctx.fillRect(
                p.x,
                p.y,
                5,
                5
            );

        }
    );


    ctx.globalAlpha=1;

    ctx.restore();

}

        tráfico
    */

    miniCtx.fillStyle="#e74c3c";

    traffic.forEach(
        car=>{

            miniCtx.fillRect(
                car.x*sx-1,
                car.y*sy-1,
                3,
                3
            );

        }
    );


    /*
        misión
    */

    if(mission){

        const target=
            mission.state==="pickup"
            ? mission.store
            : mission.house;


        miniCtx.fillStyle=
            mission.state==="pickup"
            ? "#ffd447"
            : "#ff7c47";


        miniCtx.beginPath();

        miniCtx.arc(
            target.x*sx,
            target.y*sy,
            4,
            0,
            Math.PI*2
        );

        miniCtx.fill();

    }


    /*
        jugador
    */

    miniCtx.fillStyle="#29d47d";

    miniCtx.beginPath();

    miniCtx.arc(
        player.x*sx,
        player.y*sy,
        4,
        0,
        Math.PI*2
    );

    miniCtx.fill();

}

/* =========================================================
   GAME LOOP
========================================================= */

let previousTime=
    performance.now();


function gameLoop(
    currentTime
){

    const delta=
        Math.min(
            50,
            currentTime-
            previousTime
        );


    previousTime=
        currentTime;


    if(running){

        updatePlayer();

        updateTraffic();

        updatePeople();

        updateParticles();

        checkMission();


        if(mission){

            missionTime-=
                delta/1000;


            if(
                missionTime<=0
            ){

                showToast(
                    "⏱️ Se acabó el tiempo"
                );


                mission=null;


                setTimeout(
                    ()=>{
                        if(running)
                            createMission();
                    },
                    700
                );

            }

        }


        if(
            hornCooldown>0
        ){

            hornCooldown--;

        }


        updateHUD();

    }


    drawWorld();

    drawParticles();

    drawMiniMap();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joystickActive=false;


function updateJoystick(
    event
){

    const rect=
        joystick.getBoundingClientRect();


    const centerX=
        rect.left+
        rect.width/2;


    const centerY=
        rect.top+
        rect.height/2;


    let dx=
        event.clientX-
        centerX;


    let dy=
        event.clientY-
        centerY;


    const max=
        rect.width*.32;


    const length=
        Math.hypot(
            dx,
            dy
        );


    if(
        length>max
    ){

        dx=
            dx/length*
            max;

        dy=
            dy/length*
            max;

    }


    stick.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;


    const nx=
        dx/max;


    const ny=
        dy/max;


    keys.left=
        nx<-.25;


    keys.right=
        nx>.25;


    keys.up=
        ny<-.25;


    keys.down=
        ny>.35;

}


joystick.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        joystickActive=true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event=>{

        if(
            joystickActive
        ){

            updateJoystick(
                event
            );

        }

    }
);


function endJoystick(){

    joystickActive=false;

    keys.left=false;
    keys.right=false;
    keys.up=false;
    keys.down=false;


    stick.style.transform=
        "translate(-50%,-50%)";

}


joystick.addEventListener(
    "pointerup",
    endJoystick
);


joystick.addEventListener(
    "pointercancel",
    endJoystick
);

/*
    A = acelerar
    B = frenar/reversa
    X = bocina
    Y = turbo
*/


function holdButton(
    id,
    press,
    release
){

    const button=
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            press();

        }
    );


    button.addEventListener(
        "pointerup",
        event=>{

            event.preventDefault();

            release();

        }
    );


    button.addEventListener(
        "pointercancel",
        release
    );


    button.addEventListener(
        "pointerleave",
        release
    );

}

        ){

        }


        if(
            event.key==="ArrowLeft" ||
            event.key.toLowerCase()==="a"
        ){

            keys.left=true;

        }


        if(
            event.key==="ArrowRight" ||
            event.key.toLowerCase()==="d"
        ){

            keys.right=true;

        }


        if(
            event.code==="Space"
        ){

            keys.boost=true;

        }

);


document.addEventListener(

    event=>{

        if(
            event.key==="ArrowUp" ||
            event.key.toLowerCase()==="w"
        ){

            keys.up=false;

        }


        if(
            event.key==="ArrowDown" ||
            event.key.toLowerCase()==="s"
        ){

            keys.down=false;

        }


        if(
            event.key==="ArrowLeft" ||
            event.key.toLowerCase()==="a"
        ){

            keys.left=false;

        }


        if(
            event.key==="ArrowRight" ||
            event.key.toLowerCase()==="d"
        ){

            keys.right=false;

        }


        if(
            event.code==="Space"
        ){

            keys.boost=false;

        }

    }
);

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );


    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );


    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );


    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );


    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );


    ctx.closePath();

}
