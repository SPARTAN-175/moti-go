<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Buscando conductor

</title>

<link rel="stylesheet"
href="../css/variables.css">

<link rel="stylesheet"
href="../css/main.css">

<link rel="stylesheet"
href="../css/esperando-conductor.css">

</head>

<body>

<div class="container">

<h2>

Buscando un conductor...

</h2>

<div class="card">

<p id="mensaje">

Estamos buscando el mejor conductor para tu viaje.

</p>

<div class="loader"></div>

<button
id="btnCancelar"
class="btn-cancelar">

Cancelar solicitud

</button>

</div>

</div>

<!-- Modal Cancelar -->

<div
id="cancelModal"
class="modal-overlay"
style="display:none;">

<div class="modal">

<h3>

Cancelar solicitud

</h3>

<p>

¿Estás seguro de cancelar el viaje?

</p>

<div class="modal-buttons">

<button
id="btnNoCancelar"
class="btn-secondary">

Seguir esperando

</button>

<button
id="btnConfirmarCancelar"
class="btn-danger">

Sí, cancelar

</button>

</div>

</div>

</div>
  
<script
type="module"
src="../js/esperando-conductor.js">

</script>

</body>

</html>
