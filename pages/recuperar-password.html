<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22C55E">
    <title>Recuperar contraseña | MOTI GO</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/branding/favicon.png">
    <link rel="apple-touch-icon" href="../assets/branding/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(34,197,94,.10), transparent 38%),
                #F8FAFC;
            color: #0F172A;
        }
        .moti-auth-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
        }
        .moti-auth-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 18px 50px rgba(15,23,42,.08);
        }
        .moti-auth-brand { text-align: center; margin-bottom: 26px; }
        .moti-auth-logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 14px;
            display: block;
            object-fit: contain;
        }
        .moti-auth-brand h1 {
            margin: 0;
            font-size: 1.65rem;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.6px;
        }
        .moti-auth-brand h1 span { color: #22C55E; }
        .moti-auth-brand p {
            margin: 10px auto 0;
            max-width: 330px;
            font-size: .84rem;
            line-height: 1.55;
            color: #64748B;
        }
        .recovery-form { display: flex; flex-direction: column; gap: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 7px; }
        .input-group label { font-size: .82rem; font-weight: 600; color: #334155; }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 21px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            min-height: 52px;
            padding: 0 14px 0 46px;
            border: 1px solid #CBD5E1;
            border-radius: 14px;
            outline: none;
            background: #fff;
            font-family: inherit;
            font-size: .9rem;
            color: #0F172A;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .input-group input:focus {
            border-color: #22C55E;
            box-shadow: 0 0 0 4px rgba(34,197,94,.12);
        }
        .input-group input::placeholder { color: #94A3B8; }
        #btnRecuperar {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 14px;
            background: #22C55E;
            color: #fff;
            font-family: inherit;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34,197,94,.22);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        #btnRecuperar:hover { box-shadow: 0 14px 30px rgba(34,197,94,.30); }
        #btnRecuperar:active { transform: scale(.98); }
        #btnRecuperar:disabled { opacity: .65; cursor: wait; box-shadow: none; }
        .recovery-message {
            display: none;
            margin-top: 16px;
            padding: 13px 14px;
            border-radius: 13px;
            font-size: .78rem;
            line-height: 1.5;
        }
        .recovery-message.success {
            display: block;
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            color: #166534;
        }
        .recovery-message.error {
            display: block;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #991B1B;
        }
        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #16A34A;
            font-size: .8rem;
            font-weight: 700;
            text-decoration: none;
        }
        .back-login:hover { text-decoration: underline; }
        .security-note {
            margin-top: 18px;
            padding: 12px 13px;
            display: flex;
            gap: 9px;
            align-items: flex-start;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 13px;
            color: #64748B;
            font-size: .72rem;
            line-height: 1.5;
        }
        .security-note .material-symbols-outlined { color: #22C55E; font-size: 19px; flex: 0 0 auto; }
        @media (max-width: 480px) {
            .moti-auth-page { padding: 16px 12px; }
            .moti-auth-card { padding: 28px 19px; border-radius: 21px; }
        }
    </style>
</head>
<body>
    <main class="moti-auth-page">
        <section class="moti-auth-card" aria-labelledby="tituloRecuperacion">
            <header class="moti-auth-brand">
                <img class="moti-auth-logo" src="../assets/branding/logo.png" alt="MOTI GO">
                <h1 id="tituloRecuperacion">Recuperar <span>contraseña</span></h1>
                <p>Escribe el correo electrónico con el que registraste tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</p>
            </header>

            <form id="recoveryForm" class="recovery-form" autocomplete="on">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            inputmode="email"
                            autocomplete="email"
                            placeholder="Tu correo electrónico"
                            required>
                    </div>
                </div>

                <button type="submit" id="btnRecuperar">
                    Enviar enlace de recuperación
                </button>
            </form>

            <div id="recoveryMessage" class="recovery-message" role="status" aria-live="polite"></div>

            <div class="security-note">
                <span class="material-symbols-outlined">verified_user</span>
                <span>Por seguridad, el enlace de recuperación se envía únicamente al correo asociado a la cuenta.</span>
            </div>

            <a href="login.html" class="back-login">← Volver a iniciar sesión</a>
        </section>
    </main>

    <script type="module" src="../js/recuperar-password.js"></script>
</body>
</html>
