<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#22C55E">

    <meta name="description"
          content="Crea tu cuenta de cliente en MOTI GO.">

    <title>Crear cuenta | MOTI GO</title>

    <!-- PWA -->
    <link rel="manifest"
          href="../manifest.json">

    <!-- Iconos -->
    <link rel="icon"
          type="image/png"
          href="../assets/branding/favicon.png">

    <link rel="apple-touch-icon"
          href="../assets/branding/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <!-- Estilos existentes -->
    <link rel="stylesheet"
          href="../css/variables.css">

    <link rel="stylesheet"
          href="../css/main.css">

    <link rel="stylesheet"
          href="../css/auth.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(34, 197, 94, 0.10),
                    transparent 38%
                ),
                #F8FAFC;

            color: #0F172A;
        }

        .moti-register-page {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;

            padding: 22px 18px 30px;
        }

        .moti-register-card {

            width: 100%;
            max-width: 440px;

            background: #FFFFFF;

            border: 1px solid #E2E8F0;

            border-radius: 24px;

            padding: 28px 24px;

            box-shadow:
                0 18px 50px rgba(15, 23, 42, 0.08);
        }

        /* =========================
           MARCA
        ========================= */

        .moti-register-brand {

            text-align: center;

            margin-bottom: 25px;
        }

        .moti-register-logo {

            width: 76px;
            height: 76px;

            margin: 0 auto 12px;

            display: block;

            object-fit: contain;
        }

        .moti-register-brand h1 {

            margin: 0;

            font-size: 1.75rem;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.8px;

            color: #0F172A;
        }

        .moti-register-brand h1 span {

            color: #22C55E;
        }

        .moti-register-brand p {

            margin: 9px 0 0;

            font-size: 0.82rem;

            color: #64748B;
        }

        /* =========================
           FORMULARIO
        ========================= */

        .register-form {

            display: flex;

            flex-direction: column;

            gap: 16px;
        }

        .input-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .input-group label {

            font-size: 0.8rem;

            font-weight: 600;

            color: #334155;
        }

        .input-wrapper {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #94A3B8;

            font-size: 21px;

            pointer-events: none;
        }

        .input-group input {

            width: 100%;

            min-height: 51px;

            padding:
                0 14px 0 46px;

            border:
                1px solid #CBD5E1;

            border-radius: 14px;

            outline: none;

            background: #FFFFFF;

            font-family: inherit;

            font-size: 0.87rem;

            color: #0F172A;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-group input:focus {

            border-color: #22C55E;

            box-shadow:
                0 0 0 4px
                rgba(34, 197, 94, 0.12);
        }

        .input-group input::placeholder {

            color: #94A3B8;
        }

        /* =========================
           SECCIÓN UBICACIÓN
        ========================= */

        .section-label {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-top: 4px;

            margin-bottom: -2px;

            color: #16A34A;

            font-size: 0.78rem;

            font-weight: 700;
        }

        .section-label .material-symbols-outlined {

            font-size: 19px;
        }

        .location-note {

            margin:
                -7px 0 0;

            font-size: 0.69rem;

            line-height: 1.45;

            color: #94A3B8;
        }

        /* =========================
           TÉRMINOS
        ========================= */

        .checkbox-group {

            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin-top: 2px;
        }

        .checkbox-group input {

            width: 17px;
            height: 17px;

            margin: 1px 0 0;

            accent-color: #22C55E;

            flex-shrink: 0;

            cursor: pointer;
        }

        .checkbox-group label {

            font-size: 0.72rem;

            line-height: 1.45;

            color: #64748B;

            cursor: pointer;
        }

        .checkbox-group label a {

            color: #16A34A;

            font-weight: 600;

            text-decoration: none;
        }

        /* =========================
           BOTÓN
        ========================= */

        #btnRegistro {

            width: 100%;

            min-height: 53px;

            margin-top: 4px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22C55E,
                    #16A34A
                );

            color: #FFFFFF;

            font-family: inherit;

            font-size: 0.9rem;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(34, 197, 94, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #btnRegistro:hover {

            box-shadow:
                0 14px 30px
                rgba(34, 197, 94, 0.30);
        }

        #btnRegistro:active {

            transform: scale(0.98);
        }

        /* =========================
           REGRESAR
        ========================= */

        .back-login {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #94A3B8;

            font-size: 0.72rem;

            text-decoration: none;
        }

        .back-login:hover {

            color: #64748B;
        }

        @media (max-height: 700px) {

            .moti-register-page {

                padding-top: 12px;
                padding-bottom: 20px;
            }

            .moti-register-card {

                padding-top: 20px;
                padding-bottom: 20px;
            }

            .moti-register-logo {

                width: 62px;
                height: 62px;

                margin-bottom: 9px;
            }

            .moti-register-brand {

                margin-bottom: 18px;
            }

        }

    </style>

</head>


<body>

    <main class="moti-register-page">

        <section class="moti-register-card">


            <!-- MARCA -->

            <header class="moti-register-brand">

                <img
                    class="moti-register-logo"
                    src="../assets/branding/moti-go-logo.png"
                    alt="MOTI GO">

                <h1>
                    MOTI <span>GO</span>
                </h1>

                <p>
                    Crea tu cuenta de cliente
                </p>

            </header>


            <!-- FORMULARIO -->

            <form
                class="register-form"
                autocomplete="on">


                <!-- NOMBRE -->

                <div class="input-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            person
                        </span>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            autocomplete="name"
                            placeholder="Ej. Carlos Hernández">

                    </div>

                </div>


                <!-- TELÉFONO -->

                <div class="input-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            phone
                        </span>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            inputmode="numeric"
                            autocomplete="tel"
                            placeholder="Tu número de teléfono">

                    </div>

                </div>


                <!-- UBICACIÓN -->

                <div class="section-label">

                    <span class="material-symbols-outlined">
                        location_on
                    </span>

                    Datos de ubicación

                </div>


                <p class="location-note">

                    Nos ayuda a identificar la zona donde
                    utilizarás MOTI GO.

                </p>


                <!-- MUNICIPIO -->

                <div class="input-group">

                    <label for="municipio">
                        Municipio
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            map
                        </span>

                        <input
                            type="text"
                            id="municipio"
                            name="municipio"
                            autocomplete="address-level2"
                            placeholder="Ej. Ostuacán">

                    </div>

                </div>


                <!-- LOCALIDAD -->

                <div class="input-group">

                    <label for="localidad">
                        Localidad
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            location_city
                        </span>

                        <input
                            type="text"
                            id="localidad"
                            name="localidad"
                            autocomplete="address-level3"
                            placeholder="Ej. Centro">

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            lock
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            placeholder="Crea una contraseña">

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            lock_reset
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Repite tu contraseña">

                    </div>

                </div>


                <!-- TÉRMINOS -->

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terminos">

                    <label for="terminos">

                        Acepto los
                        <a href="#">
                            términos y condiciones
                        </a>
                        de MOTI GO.

                    </label>

                </div>


                <!-- CREAR CUENTA -->

                <button
                    type="button"
                    id="btnRegistro">

                    Crear cuenta

                </button>


            </form>


            <!-- VOLVER -->

            <a
                href="registro.html"
                class="back-login">

                ← Elegir otro tipo de cuenta

            </a>


        </section>

    </main>


    <!-- LÓGICA EXISTENTE -->

    <script
        type="module"
        src="../js/registro-pasajero.js">
    </script>

</body>

</html>
