<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#22C55E">

    <title>Iniciar sesión | MOTI GO</title>

    <!-- PWA -->
    <link rel="manifest"
          href="../manifest.json">

    <!-- Iconos -->
    <link rel="icon"
          type="image/png"
          href="../assets/branding/favicon.png">

    <link rel="apple-touch-icon"
          href="../assets/branding/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <!-- Estilos existentes -->
    <link rel="stylesheet"
          href="../css/variables.css">

    <link rel="stylesheet"
          href="../css/main.css">

    <link rel="stylesheet"
          href="../css/auth.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(34, 197, 94, 0.10),
                    transparent 38%
                ),
                #F8FAFC;
            color: #0F172A;
        }

        .moti-auth-page {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px 18px;
        }

        .moti-auth-card {
            width: 100%;
            max-width: 420px;

            background: #FFFFFF;

            border: 1px solid #E2E8F0;

            border-radius: 24px;

            padding: 32px 24px;

            box-shadow:
                0 18px 50px rgba(15, 23, 42, 0.08);
        }

        .moti-auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .moti-auth-logo {
            width: 92px;
            height: 92px;

            margin: 0 auto 14px;

            display: block;

            object-fit: contain;
        }

        .moti-auth-brand h1 {
            margin: 0;

            font-size: 1.8rem;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.8px;

            color: #0F172A;
        }

        .moti-auth-brand h1 span {
            color: #22C55E;
        }

        .moti-auth-brand p {
            margin: 10px 0 0;

            font-size: 0.86rem;

            color: #64748B;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .input-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #94A3B8;

            font-size: 21px;

            pointer-events: none;
        }

        .input-group input {
            width: 100%;

            min-height: 52px;

            padding: 0 14px 0 46px;

            border: 1px solid #CBD5E1;

            border-radius: 14px;

            outline: none;

            background: #FFFFFF;

            font-family: inherit;

            font-size: 0.9rem;

            color: #0F172A;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-group input:focus {
            border-color: #22C55E;

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        .input-group input::placeholder {
            color: #94A3B8;
        }

        .forgot-password {
            text-align: right;

            margin-top: -8px;
        }

        .forgot-password a {
            color: #16A34A;

            font-size: 0.76rem;

            font-weight: 600;

            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        #btnLogin {
            width: 100%;

            min-height: 54px;

            margin-top: 4px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22C55E,
                    #16A34A
                );

            color: #FFFFFF;

            font-family: inherit;

            font-size: 0.92rem;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(34, 197, 94, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #btnLogin:hover {
            box-shadow:
                0 14px 30px rgba(34, 197, 94, 0.30);
        }

        #btnLogin:active {
            transform: scale(0.98);
        }

        .separator {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0 18px;

            color: #94A3B8;

            font-size: 0.75rem;
        }

        .separator::before,
        .separator::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #E2E8F0;
        }

        .separator span {
            flex-shrink: 0;
        }

        .btn-secondary {
            width: 100%;

            min-height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #BBF7D0;

            border-radius: 15px;

            background: #F0FDF4;

            color: #15803D;

            text-decoration: none;

            font-size: 0.88rem;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .btn-secondary:hover {
            background: #DCFCE7;
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .back-home {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #94A3B8;

            font-size: 0.72rem;

            text-decoration: none;
        }

        .back-home:hover {
            color: #64748B;
        }

        @media (max-height: 650px) {

            .moti-auth-page {
                padding: 14px 18px;
            }

            .moti-auth-card {
                padding: 22px 20px;
            }

            .moti-auth-logo {
                width: 70px;
                height: 70px;
                margin-bottom: 10px;
            }

            .moti-auth-brand {
                margin-bottom: 20px;
            }

        }

    </style>

</head>


<body>

    <main class="moti-auth-page">

        <section class="moti-auth-card">


            <!-- MARCA -->

            <header class="moti-auth-brand">

                <img
                    class="moti-auth-logo"
                    src="../assets/branding/moti-go-logo.png"
                    alt="MOTI GO">

                <h1>
                    MOTI <span>GO</span>
                </h1>

                <p>
                    Bienvenido de nuevo 👋
                </p>

            </header>


            <!-- FORMULARIO -->

            <form
                class="login-form"
                autocomplete="on">


                <!-- TELÉFONO -->

                <div class="input-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            phone
                        </span>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            inputmode="numeric"
                            autocomplete="tel"
                            placeholder="Tu número de teléfono">

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="material-symbols-outlined input-icon">
                            lock
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Tu contraseña">

                    </div>

                </div>


                <!-- RECUPERAR CONTRASEÑA -->

                <div class="forgot-password">

                    <a href="recuperar-password.html">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- LOGIN -->

                <button
                    type="button"
                    id="btnLogin">

                    Iniciar sesión

                </button>

            </form>


            <!-- SEPARADOR -->

            <div class="separator">

                <span>o</span>

            </div>


            <!-- REGISTRO -->

            <a
                href="registro.html"
                class="btn-secondary">

                Crear una cuenta

            </a>


            <!-- VOLVER -->

            <a
                href="../index.html"
                class="back-home">

                ← Volver al inicio

            </a>


        </section>

    </main>


    <!-- LÓGICA DE LOGIN -->
    <script
        type="module"
        src="../js/login.js">
    </script>

</body>

</html>
